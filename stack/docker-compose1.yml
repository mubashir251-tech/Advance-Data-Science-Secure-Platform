name: mlops-sec-lab

services:

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes: ["mlflowdb:/var/lib/postgresql/data"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    depends_on: [minio, mlflow-db]
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      bash -c "pip install psycopg2-binary boto3 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-db/mlflow
      --artifacts-destination s3://mlflow"
    ports: ["5000:5000"]

  jupyterhub:
    image: jupyter/scipy-notebook:python-3.11
    command: start-notebook.sh --NotebookApp.token='admin' --NotebookApp.password=''
    ports: ["8000:8888"]
    volumes: ["../:/home/jovyan/lab"]

  airflow:
    image: apache/airflow:2.10.2
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: bash -c "airflow db migrate && airflow users create -u admin -p admin -r Admin -e a@a.a -f a -l a || true; airflow standalone"
    ports: ["8080:8080"]
    volumes:
      - "../pipelines/dags:/opt/airflow/dags"
      - "../:/opt/lab"
  opa:
    image: openpolicyagent/opa:0.69.0
    command: ["run", "--server", "--addr=:8181", "/policies"]
    ports: ["8181:8181"]
    volumes: ["../compliance/policies:/policies"]

volumes:
  minio:
  mlflowdb:
